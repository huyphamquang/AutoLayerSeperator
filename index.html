<html lang="en">

<head>
  <meta charset="utf-8">
  <title>UI</title>
  <link rel="stylesheet" type="text/css" href="css/app.css">
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
</head>

<body>
  <div class="container-fluid">

    <label class="control-label m-1" for="txtFileConfig">File cấu hình:</label>
    <div class="m-1">
      <input type="text" class="form-control form-control-sm" id="txtExcel" readonly placeholder="Chưa chọn file cấu hình">
    </div>

  </div>
  <div class="m-3">
    <button class="btn btn-sm btn-primary btn-block" id="btnSelectExcel" type="button">Chọn file</button>
  </div>

  <div class="m-3">
    <button class="btn btn-sm btn-warning btn-block" id="btnPopulate" type="button" disabled>Tách lớp</button>
    <span class="badge badge-info">Version 1.0.0</span>
  </div>
  
  <!-- Toast box moved outside container for proper floating -->
  <div class="alert alert-danger toast" role="alert" style="display: none;">
    This is a danger alert—check it out!
  </div>
</body>
<script src="js/jquery-3.2.1.slim.min.js"></script>
<script src="js/popper.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/CSInterface.js"></script>
<script src="js/main.js?v15"></script>

</html>
