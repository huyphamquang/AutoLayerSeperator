<html lang="en">

<head>
  <meta charset="utf-8">
  <title>UI</title>
  <link rel="stylesheet" type="text/css" href="css/app.css">
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
</head>

<body>
  <div class="container-fluid">
    <br/>
    <div class="m-1">
      <small class="form-text text-muted">
        Chọn file tách lớp (id.png) để thực hiện. File trắng (trang.jpg, trang.png, hoặc trang.tiff) phải có trong thư mục chứa file được chọn.
      </small>
    </div>
  </div>
  <div class="m-3">
    <button class="btn btn-sm btn-primary btn-block" id="btnSelectFile" type="button">Chọn file và tách lớp</button>
    <br/>
    <div class="text-right mt-1"><span class="badge badge-info">Version 1.0.2</span></div>
  </div>
  
  <!-- Toast box moved outside container for proper floating -->
  <div class="alert alert-danger toast" role="alert" style="display: none;">
    This is a danger alert—check it out!
  </div>
</body>
<script src="js/jquery-3.2.1.slim.min.js"></script>
<script src="js/popper.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/CSInterface.js"></script>

</html>
